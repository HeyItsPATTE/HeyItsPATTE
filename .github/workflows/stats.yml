name: Update profile stats

on:
  schedule:
    - cron: "17 4 * * *" # daily, 06:17 in Berlin summer time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/stats/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build stats cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
          EXCLUDE_LANGS: ShaderLab,HLSL
        run: node .github/stats/build.mjs

      - name: Commit if changed
        run: |
          [ -f assets/stats-dark.svg ] || { echo "No stats generated, nothing to commit."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push
